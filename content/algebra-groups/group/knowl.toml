[[core.data]]
id = "operation"
text = 'A binary operation $\cdot : G \times G \to G$.'
refs = ["shared-foundations/binary-operation"]

[[core.data]]
id = "identity"
text = 'An identity element $e \in G$.'

[[core.data]]
id = "inverse"
text = 'An inverse operation sending $a \in G$ to $a^{-1} \in G$.'

[[core.axioms]]
id = "associativity"
text = 'For all $a,b,c \in G$, $(a\cdot b)\cdot c = a\cdot(b\cdot c)$.'

[[core.axioms]]
id = "identity"
text = 'For all $a \in G$, $e\cdot a = a$ and $a\cdot e = a$.'

[[core.axioms]]
id = "inverse"
text = 'For every $a \in G$, $a\cdot a^{-1} = e$ and $a^{-1}\cdot a = e$.'

